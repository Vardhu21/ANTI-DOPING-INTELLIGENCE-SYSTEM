<!DOCTYPE html>
<html>

<head>
    <title>Athletes · ADIS</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>ADIS</h1>
        </div>

        <div class="sidebar-badge">
            <div class="label">Officer Credential</div>
            <div class="officer-id" id="sidebarOfficerId">OFF-000000</div>
            <div class="officer-name" id="sidebarOfficerName">Loading...</div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Dashboard</span>
            </a>
            <a href="athletes.html" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
                <span>Athletes</span>
            </a>
            <a href="samples.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6L4 20a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3L15 8V2"></path><path d="M9 2h6"></path><path d="M6 15h12"></path></svg>
                <span>Samples</span>
            </a>
            <a href="reports.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg>
                <span>Reports</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" onclick="adisLogout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h2>Athletes</h2>
                <div class="tagline">Registered under your credential</div>
            </div>
            <button class="btn btn-gold" onclick="openAthleteModal()">+ Register Athlete</button>
        </div>

        <div class="content">
            <div class="panel">
                <div class="panel-header">
                    <h3>All Athletes</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Athlete ID</th>
                            <th>Name</th>
                            <th>Gender</th>
                            <th>Sport</th>
                            <th>Nationality</th>
                            <th>Blood Group</th>
                            <th>Contact</th>
                        </tr>
                    </thead>
                    <tbody id="athletesTableBody">
                        <tr class="empty-row"><td colspan="7">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <div class="modal-overlay" id="athleteModalOverlay">
        <div class="modal">
            <h3>Register New Athlete</h3>
            <form id="athleteForm">
                <div class="form-grid">
                    <div class="full">
                        <label>Full Name *</label>
                        <input type="text" id="athleteName" required />
                    </div>
                    <div>
                        <label>Gender *</label>
                        <select id="athleteGender" required>
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label>Date of Birth</label>
                        <input type="date" id="athleteDob" />
                    </div>
                    <div>
                        <label>Nationality</label>
                        <input type="text" id="athleteNationality" />
                    </div>
                    <div>
                        <label>Sport *</label>
                        <input type="text" id="athleteSport" required />
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" id="athleteEmail" />
                    </div>
                    <div>
                        <label>Phone</label>
                        <input type="tel" id="athletePhone" />
                    </div>
                    <div>
                        <label>Blood Group</label>
                        <select id="athleteBloodGroup">
                            <option value="">Select</option>
                            <option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option>
                            <option>O+</option><option>O-</option>
                        </select>
                    </div>
                    <div>
                        <label>Weight (kg)</label>
                        <input type="number" step="0.1" id="athleteWeight" />
                    </div>
                    <div>
                        <label>Height (cm)</label>
                        <input type="number" step="0.1" id="athleteHeight" />
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeAthleteModal()">Cancel</button>
                    <button type="submit" class="btn btn-gold" id="athleteSubmitBtn">Register Athlete</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth-guard.js"></script>
    <script src="athletes.js"></script>

</body>

</html>
